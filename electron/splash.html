            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        .splash-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .icon-container {
            width: 84px;
            height: 84px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.28) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
        }
        .icon-container img {
            width: 74px;
            height: 74px;
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
        }
        .app-title {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .app-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 0.2px;
        }
        .progress-bar-container {
            width: 270px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }
        .progress-bar {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border-radius: 2px;
            width: 40%;
            animation: indeterminate 1.4s ease-in-out infinite;
        }
        @keyframes indeterminate {
            0% {
                left: -40%;
            }
            100% {
                left: 100%;
            }
        }
        .status-text {
            font-size: 12px;
            color: #cbd5e1;
            font-style: italic;
        }
    </style>
</head>
